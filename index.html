<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="./assets/images/favicon-32x32.png">
  <link rel="stylesheet" type="text/css" href="./styles.css">
  <title>Frontend Mentor | Social links profile</title>

</head>
<body>

<main>
  <article class="profile-card">
    <header class="profile-card__header">
      <figure class="profile-card__avatar">
        <img src="./assets/images/avatar-jessica.jpeg" alt="profile image">
      </figure>
      <div class="profile-card__info">
        <h2 class="profile-card__name">Jessica Randall</h2>
        <h5 class="profile-card__location">London, United Kingdom</h5>
        <p class="profile-card__bio">
          "Front-end developer and avid reader."
        </p>
      </div>
    </header>
    <section class="profile-card__actions">
      <a class="btn" href="#" aria-label="Visit Jessica's GitHub">GitHub</a>
      <a class="btn" href="#" aria-label="Visit Jessica's Frontend Mentor">Frontend Mentor</a>
      <a class="btn" href="#" aria-label="Visit Jessica's LinkedIn">LinkedIn</a>
      <a class="btn" href="#" aria-label="Visit Jessica's Twitter">Twitter</a>
      <a class="btn" href="#" aria-label="Visit Jessica's Instagram">Instagram</a>
    </section>
  </article>
</main>

</html>
